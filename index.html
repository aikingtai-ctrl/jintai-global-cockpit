  <script>

    ];
    const STOPWORDS_RE = /(请问|帮我找一下|帮我找|找一下|在哪里|在哪儿|在哪|是什么|是多少|多少|怎么|打开|上次|之前|那个|关于|给我|帮我|做的|写的|弄的|出的|给|做|弄|写|看|把|的|了|吗|呢|吧|呀)/g;

    function ensureDecodedSnapshot() {
      if (window.COCKPIT_SNAPSHOT && window.COCKPIT_SNAPSHOT.items) return window.COCKPIT_SNAPSHOT;
      if (typeof window.COCKPIT_SNAPSHOT_ENC === "string" && window.COCKPIT_SNAPSHOT_ENC.length > 0) {
        try {
          const bin = atob(window.COCKPIT_SNAPSHOT_ENC);
          const keyBytes = new Uint8Array(32);
          for (let i = 0; i < 32; i++) {
            keyBytes[i] = parseInt(JT_GATE_HASH.slice(i * 2, i * 2 + 2), 16);
          }
          const out = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) {
            out[i] = bin.charCodeAt(i) ^ keyBytes[i & 31] ^ ((i * 31) & 0xff);
          }
          const jsonStr = new TextDecoder("utf-8").decode(out);
          window.COCKPIT_SNAPSHOT = JSON.parse(jsonStr);
          window.COCKPIT_SNAPSHOT_ENC = "";
          return window.COCKPIT_SNAPSHOT;
        } catch (e) {
          console.error("Snapshot decode error:", e);
        }
      }
      return window.COCKPIT_SNAPSHOT || null;
    }
    ensureDecodedSnapshot();
    const EXT_LABELS = {
      pdf: "只看 PDF",
      office: "只看 Word/Excel/PPT",
      md: "只看 Markdown/TXT",
      html: "只看 HTML 网页",
      mp4: "只看 MP4/MOV 视频",
      image: "只看 图片/分镜",
      audio: "只看 配音/音乐",
    };

    let serverOnline = false;
    let currentKind = "all";
    let currentExt = "all";
    let currentCat = "all";
    let currentResults = [];
    let debounceTimer = null;
    let knownVersion = (window.COCKPIT_VERSION && window.COCKPIT_VERSION.version) || 0;
    let evtSource = null;

    // 全部已渲染卡片的内存对象字典：所有按钮统一通过 data-act + data-id 事件委托读取原始对象，彻底根除反斜杠 C:\Users 转义报错
    const itemStore = new Map();
    const promptStore = new Map();
    const BROWSER_VIEWABLE_EXTS = new Set(["pdf", "mp4", "mov", "png", "jpg", "jpeg", "webp", "wav", "mp3", "html", "htm"]);
    const INLINE_THEATER_EXTS = new Set(["mp4", "mov", "wav", "mp3", "png", "jpg", "jpeg", "webp", "pdf"]);

    function checkSchemaReload(payload) {
      const sv = payload && (payload.ui_schema_version || (payload.stats && payload.stats.ui_schema_version));
      if (sv && Number(sv) > UI_SCHEMA_VERSION && window.location.protocol.startsWith("http")) {
        window.location.reload();
        return true;
      }
      return false;
    }

    function fmtNum(n) {
      return Number(n || 0).toLocaleString("zh-CN");
    }

    function showToast(msg) {
      const el = document.getElementById("toastBox");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove("show"), 2500);
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function highlightText(text, words) {
      let safe = escapeHtml(text || "");
      if (!words || !words.length) return safe;
      for (const w of words) {
        if (!w || w.length < 1) continue;
        const escapedW = w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        try {
          const re = new RegExp(`(${escapedW})`, "gi");
          safe = safe.replace(re, "<mark>$1</mark>");
        } catch (_) {}
      }
      return safe;
    }

    function setFontSize(px) {
      document.documentElement.style.setProperty("--base-font", px + "px");
      localStorage.setItem("jintai_cockpit_fsize", String(px));
      document.querySelectorAll("[data-fsize]").forEach(btn => {
        btn.classList.toggle("active", Number(btn.dataset.fsize) === px);
      });
    }

    function toggleTheme() {
      const isDark = document.body.classList.toggle("dark");
      localStorage.setItem("jintai_cockpit_dark", isDark ? "1" : "0");
      document.getElementById("themeBtn").textContent = isDark ? "☀️ 浅色高对比" : "🌙 深色护眼";
    }

    function initPrefs() {
      const savedSize = Number(localStorage.getItem("jintai_cockpit_fsize") || "22");
      setFontSize([22, 26, 30].includes(savedSize) ? savedSize : 22);
      if (localStorage.getItem("jintai_cockpit_dark") === "1") {
        document.body.classList.add("dark");
        document.getElementById("themeBtn").textContent = "☀️ 浅色高对比";
      }
    }

    function syncFilterPillsUI() {
      document.querySelectorAll("#kindTabs .tab-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.kind === currentKind);
      });
      document.querySelectorAll("[data-ext]").forEach(b => {
        b.classList.toggle("active", b.dataset.ext === currentExt);
      });
      document.querySelectorAll("[data-cat]").forEach(b => {
        b.classList.toggle("active", b.dataset.cat === currentCat);
      });

      const alertBox = document.getElementById("activeFilterAlert");
      const alertTxt = document.getElementById("activeFilterText");
      const activeParts = [];
      if (currentExt !== "all") activeParts.push(`格式过滤：${EXT_LABELS[currentExt] || currentExt}`);
      if (currentCat !== "all") activeParts.push(`业务域：${currentCat}`);
      if (activeParts.length > 0) {
        alertTxt.textContent = `⚠️ 注意：当前已开启【${activeParts.join(" ＋ ")}】，非匹配格式已隐藏`;
        alertBox.classList.add("show");
      } else {
        alertBox.classList.remove("show");
      }
    }

    function resetAllFilters() {
      currentKind = "all";
      currentExt = "all";
      currentCat = "all";
      syncFilterPillsUI();
      refreshView();
    }

    function setQuickQuery(q) {
      // 点击热词时自动重置残留的格式筛选（如只看MP4），保证全类型结果完整呈现
      currentKind = "all";
      currentExt = "all";
      currentCat = "all";
      syncFilterPillsUI();
      const input = document.getElementById("searchInput");
      input.value = q;
      document.getElementById("clearBtn").classList.toggle("visible", !!q);
      runSearch();
    }

    function clearSearch() {
      const input = document.getElementById("searchInput");
      input.value = "";
      currentExt = "all";
      syncFilterPillsUI();
      document.getElementById("clearBtn").classList.remove("visible");
      document.getElementById("synonymBanner").textContent = "";
      input.focus();
      refreshView();
    }

    function setKind(k) {
      currentKind = k;
      // 切换到“全部目标”或非文档/媒体页签时，自动清除残留的格式筛选，彻底根除误过滤陷阱
      if (k === "all" || !["doc", "media"].includes(k)) {
        currentExt = "all";
      }
      syncFilterPillsUI();
      refreshView();
    }

    function setExt(ext) {
      currentExt = ext;
      if (ext !== "all") {
        if (["pdf", "office", "md", "html"].includes(ext)) {
          currentKind = "doc";
        } else if (["mp4", "image", "audio"].includes(ext)) {
          currentKind = "media";
        }
      }
      syncFilterPillsUI();
      refreshView();
    }

    function setCat(cat) {
      currentCat = cat;
      syncFilterPillsUI();
      refreshView();
    }

    function refreshView(silent = false) {
      const q = document.getElementById("searchInput").value.trim();
      if (!q && currentKind === "all" && currentExt === "all" && currentCat === "all") {
        loadHome(silent);
      } else {
        runSearch(silent);
      }
    }

    async function copyText(txt, toastPrefix = "✅ 已复制") {
      try {
        await navigator.clipboard.writeText(txt);
        showToast(`${toastPrefix}：${txt.slice(0, 68)}${txt.length > 68 ? "…" : ""}`);
      } catch (_) {
        const ta = document.createElement("textarea");
        ta.value = txt;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
        showToast(toastPrefix);
      }
    }

    function copyStoredPrompt(itemId) {
      const p = promptStore.get(itemId) || "";
      if (p) {
        copyText(p, "✅ 已复制完整提示词");
      } else {
        showToast("⚠️ 该条目暂无独立提示词字段");
      }
    }

    async function openTarget(pathStr, mode = "open", obsRel = "", itemId = "") {
      // 始终优先直接请求本地 18899 服务执行原生 Win32 前台打开，不依赖缓存布尔值
      try {
        const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
        if (ctrl) setTimeout(() => ctrl.abort(), IS_CLOUD_HOST ? 600 : 3000);
        const res = await fetch(`${API_BASE}/api/open`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: itemId, path: pathStr, mode, obsidian_rel: obsRel }),
          signal: ctrl ? ctrl.signal : undefined,
        });
        const data = await res.json();
        serverOnline = true;
        if (data.ok) {
          if (data.action === "open_dir") {
            showToast("📂 已在桌面最前方打开该项目文件夹");
          } else if (mode === "reveal" || data.action === "reveal_instead_of_exec" || data.action === "reveal_fallback") {
            showToast("📂 已弹出资源管理器并高亮选中该文件");
          } else if (mode === "obsidian") {
            showToast("🟣 已唤起 Obsidian 打开该卡片");
          } else {
            showToast("🚀 已调用系统默认程序直接打开：" + basenameOf(pathStr));
          }
        } else {
          showToast("⚠️ " + (data.error || "打开失败"));
        }
        return;
      } catch (_) {
        serverOnline = false;
      }

      const it = itemId ? itemStore.get(itemId) : null;
      if (IS_CLOUD_HOST && it && it.kind === "atlas") {
        const sub = String(it.subtype || "");
        let cloudUrl = "https://aikingtai-ctrl.github.io/jintai-history-image-library/index.html";
        if (sub.includes("影视")) cloudUrl = "https://aikingtai-ctrl.github.io/jintai-history-image-library/sources.html";
        else if (sub.includes("名人")) cloudUrl = "https://aikingtai-ctrl.github.io/jintai-history-image-library/figures.html";
        window.open(cloudUrl, "_blank", "noopener");
        return;
      }
      if (mode === "obsidian" && obsRel) {
        window.location.href = `obsidian://open?vault=${encodeURIComponent("AI永久记忆")}&file=${encodeURIComponent(obsRel)}`;
        return;
      }
      if (!IS_CLOUD_HOST && mode === "open" && pathStr) {
        const fileUri = "file:///" + String(pathStr).replace(/\\/g, "/");
        window.open(fileUri, "_blank");
      }
      await copyText(pathStr, IS_CLOUD_HOST ? "📋 已复制完整路径" : "📋 已复制路径（双击桌面驾驶舱图标可开启资源管理器直达）");
    }

      } else if (["png", "jpg", "jpeg", "webp"].includes(subLow)) {
        bodyEl.innerHTML = `<div style="text-align:center"><img style="max-width:100%;max-height:73vh;border-radius:10px;object-fit:contain" src="${streamUrl}" alt="${escapeHtml(it.title)}" /></div>`;
      } else if (subLow === "pdf") {
        bodyEl.innerHTML = `<iframe style="width:100%;height:74vh;border:none;border-radius:10px;background:#fff" src="${streamUrl}"></iframe>`;
      } else {

    function buildOfflineDetailBody(stored, sumVal, pathVal, obsVal) {
      const lines = [];
      if (stored.category || stored.subtype || stored.updated_at || stored.size_human) {
        lines.push(`【分类与类型】${stored.category || "综合"} · ${stored.subtype || stored.kind || ""} · ${stored.updated_at || ""}${stored.size_human ? " · " + stored.size_human : ""}`);
      }
      if (pathVal) lines.push(`【完整路径】${pathVal}`);
      if (obsVal) lines.push(`【Obsidian卡片】[[${obsVal}]]`);
      lines.push("");
      lines.push(sumVal || "");
      if (stored.extra && stored.extra.prompt) {
        lines.push("");
        lines.push("【完整提示词 / 镜头描述】");
        lines.push(stored.extra.prompt);
      }
      if (stored.extra && Array.isArray(stored.extra.linked_files) && stored.extra.linked_files.length) {
        lines.push("");
        lines.push("【关联交付文件】");
        stored.extra.linked_files.forEach(fp => lines.push("• " + fp));
      }
      return lines.join("\n");
    }

    async function viewDetail(itemId, fallbackTitle, fallbackSummary, fallbackPath, obsRel, skipTheater = false) {
      const stored = itemStore.get(itemId) || {};
      const subLow = String(stored.subtype || "").toLowerCase();
      if (!skipTheater && !IS_CLOUD_HOST && stored.kind === "media" && INLINE_THEATER_EXTS.has(subLow)) {
        openPreviewModal(itemId);
        return;
      }
      const titleVal = fallbackTitle || stored.title || "详情";
      const sumVal = fallbackSummary || stored.summary || "";
      const pathVal = fallbackPath || stored.path || "";
      const obsVal = obsRel !== undefined ? obsRel : (stored.obsidian_rel || "");

      const modal = document.getElementById("detailModal");
      const titleEl = document.getElementById("modalTitle");
      const metaEl = document.getElementById("modalMeta");
      const bodyEl = document.getElementById("modalBody");
      const actEl = document.getElementById("modalActions");

      bodyEl.style.whiteSpace = "pre-wrap";
      titleEl.textContent = titleVal;
      metaEl.textContent = `${stored.subtype || ""} · ${stored.updated_at || ""} · ${pathVal}`;
      bodyEl.textContent = IS_CLOUD_HOST ? buildOfflineDetailBody(stored, sumVal, pathVal, obsVal) : "正在读取完整内容…";
      actEl.innerHTML = "";

      if (promptStore.has(itemId)) {
        const bp = document.createElement("button");
        bp.className = "ctrl-btn active";
        bp.textContent = "📋 复制提示词";
        bp.onclick = () => copyStoredPrompt(itemId);
        actEl.appendChild(bp);
      }
      if (obsVal) {
        const b1 = document.createElement("button");
        b1.className = "ctrl-btn";
        b1.textContent = "🟣 Obsidian打开";
        b1.onclick = () => openTarget(pathVal, "obsidian", obsVal, itemId);
        actEl.appendChild(b1);
      }
      if (pathVal) {
        const bCopy = document.createElement("button");
        bCopy.className = "ctrl-btn";
        bCopy.textContent = "📋 复制路径";
        bCopy.onclick = () => copyText(pathVal, "📋 已复制完整路径");
        actEl.appendChild(bCopy);

        const bOpen = document.createElement("button");
        bOpen.className = "ctrl-btn";
        bOpen.textContent = "🚀 直接打开文件";
        bOpen.onclick = () => openTarget(pathVal, "open", "", itemId);
        actEl.appendChild(bOpen);

        const b2 = document.createElement("button");
        b2.className = "ctrl-btn";
        b2.textContent = "📂 定位文件夹";
        b2.onclick = () => openTarget(pathVal, "reveal", "", itemId);
        actEl.appendChild(b2);
      }
      const closeB = document.createElement("button");
      closeB.className = "ctrl-btn";
      closeB.textContent = "✕ 关闭 (Esc)";
      closeB.onclick = closeModal;
      actEl.appendChild(closeB);

      modal.classList.add("open");

      if (IS_CLOUD_HOST) return;
      try {
        const res = await fetch(`${API_BASE}/api/detail?id=${encodeURIComponent(itemId)}`);
        const data = await res.json();
        serverOnline = true;
        if (data.ok && data.item) {
          metaEl.textContent = `${data.item.subtype} · ${data.item.updated_at} · ${data.item.path}`;
          bodyEl.textContent = data.item.body || data.item.summary;
        } else {
          bodyEl.textContent = buildOfflineDetailBody(stored, sumVal, pathVal, obsVal);
        }
      } catch (_) {
        bodyEl.textContent = buildOfflineDetailBody(stored, sumVal, pathVal, obsVal);
      }
    }

    function closeModal() {
      const modal = document.getElementById("detailModal");
      const bodyEl = document.getElementById("modalBody");
      bodyEl.querySelectorAll("video, audio").forEach(m => {
        try { m.pause(); m.removeAttribute("src"); m.load(); } catch (_) {}
      });
      bodyEl.innerHTML = "";
      modal.classList.remove("open");
    }

    function kindBadgeHtml(it) {
      if (it.kind === "doc") {
        const extMap = { pdf: "📕 PDF", docx: "📘 Word", doc: "📘 Word", xlsx: "📗 Excel", xls: "📗 Excel", csv: "📗 CSV", pptx: "📙 PPT", html: "🌐 网页", htm: "🌐 网页", md: "📝 Markdown", txt: "📄 文本" };
        const label = extMap[it.subtype] || ("📄 " + String(it.subtype || "").toUpperCase());
        return `<span class="badge badge-doc">${escapeHtml(label)}</span>`;
      }
      if (it.kind === "media") {
        const mMap = { mp4: "🎬 视频成片", mov: "🎬 视频", mkv: "🎬 视频", png: "🖼️ 图片/分镜", jpg: "🖼️ 照片", jpeg: "🖼️ 照片", webp: "🖼️ 图片", wav: "🔊 配音/WAV", mp3: "🎵 音频/MP3", blend: "🧊 Blender", zip: "📦 归档包", "7z": "📦 归档包" };
        const label = mMap[it.subtype] || ("🎬 " + String(it.subtype || "").toUpperCase());
        return `<span class="badge badge-media">${escapeHtml(label)}</span>`;
      }
      if (it.kind === "folder") {
        return `<span class="badge badge-folder">📁 项目目录</span>`;
      }
      if (it.kind === "memory") {
        return `<span class="badge badge-mem">📌 ${escapeHtml(it.subtype)}</span>`;
      }
      if (it.kind === "session") {
        return `<span class="badge badge-sess">💬 ${escapeHtml(it.subtype)}</span>`;
      }
      if (it.kind === "atlas") {
        return `<span class="badge badge-atlas">🏛️ ${escapeHtml(it.subtype)}</span>`;
      }
      return `<span class="badge badge-skill">🧰 全局 Skill</span>`;
    }

    function basenameOf(p) {
      const parts = String(p || "").split(/[\\/]/);
      return parts[parts.length - 1] || p;
    }

    function renderCard(it, highlights = []) {
      itemStore.set(it.id, it);
      if (it.extra && it.extra.prompt) {
        promptStore.set(it.id, it.extra.prompt);
      }
      const idAttr = escapeHtml(it.id);
      const titleHtml = highlightText(it.title, highlights);
      const summaryHtml = highlightText(it.summary, highlights);
      const todoBadge = it.has_todo ? `<span class="badge badge-todo">⏳ 待拍板</span>` : "";
      const catBadge = it.category ? `<span class="badge badge-cat">${escapeHtml(it.category)}</span>` : "";

      let linkedHtml = "";
      const linkedFiles = (it.extra && it.extra.linked_files) || [];
      if (linkedFiles.length > 0 && !["doc", "media", "folder"].includes(it.kind)) {
        const chips = linkedFiles.slice(0, 4).map((fp, idx) => {
          return `<button type="button" class="linked-file-chip" title="${escapeHtml(fp)}" data-act="open-linked" data-id="${idAttr}" data-fidx="${idx}">📎 直开：${escapeHtml(basenameOf(fp))}</button>`;
        }).join("");
        linkedHtml = `<div class="linked-files-box">${chips}</div>`;
      }

      let actions = "";
      if (it.kind === "doc" || it.kind === "media") {
        const subLow = String(it.subtype || "").toLowerCase();
        const isVideoAudio = ["mp4", "mov", "wav", "mp3"].includes(subLow);
        const isImg = ["png", "jpg", "jpeg", "webp"].includes(subLow);
        const isPdf = subLow === "pdf";
        if (isVideoAudio || isImg) {
          const playLabel = isVideoAudio ? "▶️ 页内秒播" : "🖼️ 页内秒看";
          actions = `
            <button type="button" class="act-btn primary" data-act="preview-media" data-id="${idAttr}">${playLabel}</button>
            <button type="button" class="act-btn" data-act="open" data-id="${idAttr}">🚀 系统播放器打开</button>
            <button type="button" class="act-btn" data-act="reveal" data-id="${idAttr}">📂 定位文件夹</button>
            <button type="button" class="act-btn" data-act="copy-path" data-id="${idAttr}">📋 复制路径</button>
          `;
        } else {
          const pdfInlineBtn = isPdf
            ? `<button type="button" class="act-btn" data-act="preview-media" data-id="${idAttr}">📕 页内秒看PDF</button>`
            : (BROWSER_VIEWABLE_EXTS.has(subLow)
                ? `<a class="act-btn" style="text-decoration:none" href="${API_BASE}/api/file?id=${encodeURIComponent(it.id)}" target="_blank" rel="noopener">🌐 网页秒看</a>`
                : "");
          const readBtn = ["md", "txt", "csv", "pdf", "docx", "xlsx", "pptx"].includes(subLow)
            ? `<button type="button" class="act-btn" data-act="detail" data-id="${idAttr}">📖 大字预览正文</button>`
            : "";
          actions = `
            <button type="button" class="act-btn primary" data-act="open" data-id="${idAttr}">🚀 直接打开文件</button>
            ${pdfInlineBtn}
            <button type="button" class="act-btn" data-act="reveal" data-id="${idAttr}">📂 定位文件夹</button>
            ${readBtn}
            <button type="button" class="act-btn" data-act="copy-path" data-id="${idAttr}">📋 复制路径</button>
          `;
        }
      } else if (it.kind === "folder") {
        actions = `
          <button type="button" class="act-btn primary" data-act="open" data-id="${idAttr}">📂 直接打开文件夹</button>
          <button type="button" class="act-btn" data-act="copy-path" data-id="${idAttr}">📋 复制路径</button>
        `;
      } else if (it.kind === "memory") {
        actions = `
          <button type="button" class="act-btn primary" data-act="detail" data-id="${idAttr}">📖 看完整结论</button>
          ${it.obsidian_rel ? `<button type="button" class="act-btn" data-act="obsidian" data-id="${idAttr}">🟣 Obsidian打开</button>` : ""}

          <button type="button" class="act-btn" data-act="copy-path" data-id="${idAttr}">📋 复制路径</button>
        `;
      } else if (it.kind === "session") {
        const claudeUrl = (it.extra && it.extra.app_url) ? it.extra.app_url : "";
        actions = `
          <button type="button" class="act-btn primary" data-act="detail" data-id="${idAttr}">📖 阅读完整对话</button>
          ${claudeUrl ? `<a class="act-btn" style="text-decoration:none" href="${escapeHtml(claudeUrl)}">⚡ 跳回 Claude</a>` : ""}
          ${it.obsidian_rel ? `<button type="button" class="act-btn" data-act="obsidian" data-id="${idAttr}">🟣 归档原文</button>` : ""}
          <button type="button" class="act-btn" data-act="copy-path" data-id="${idAttr}">📋 复制路径</button>
        `;
      } else if (it.kind === "atlas") {
        actions = `
          <button type="button" class="act-btn primary" data-act="copy-prompt" data-id="${idAttr}">📋 复制完整提示词</button>
          <button type="button" class="act-btn" data-act="detail" data-id="${idAttr}">📖 考证与全文</button>
          <button type="button" class="act-btn" data-act="open" data-id="${idAttr}">🏛️ 打开图库专页</button>

      } else {
        actions = `
          <button type="button" class="act-btn primary" data-act="copy-skill" data-id="${idAttr}">⚡ 复制 /${escapeHtml(it.title)}</button>
          <button type="button" class="act-btn" data-act="detail" data-id="${idAttr}">📖 查看用法</button>
          <button type="button" class="act-btn" data-act="reveal" data-id="${idAttr}">📂 技能目录</button>
        `;
      }

      return `
        <article class="card kind-${escapeHtml(it.kind)}">
          <div>

                ${todoBadge}

            </div>
            <h3 class="card-title" data-act="title-click" data-id="${idAttr}" title="点击直接打开">${titleHtml}</h3>
            <p class="card-summary" style="margin-top:8px;">${summaryHtml}</p>
            ${linkedHtml}
          </div>
          <div class="card-actions">${actions}</div>
        </article>
      `;
    }

    function matchSubtypeExt(subtype, extFilter) {
      if (!extFilter || extFilter === "all") return true;
      const s = String(subtype || "").toLowerCase();
      if (extFilter === "office") return ["docx", "doc", "xlsx", "xls", "pptx", "ppt", "csv"].includes(s);
      if (extFilter === "mp4") return ["mp4", "mov", "mkv", "avi"].includes(s);
      if (extFilter === "image") return ["png", "jpg", "jpeg", "webp"].includes(s);
      if (extFilter === "audio") return ["wav", "mp3"].includes(s);
      if (extFilter === "html") return ["html", "htm"].includes(s);
      if (extFilter === "md") return ["md", "txt"].includes(s);
      return s === extFilter;
    }

    function expandTermSynonymsJS(tok) {
      const tl = tok.toLowerCase();
      const variants = [tl];
      const disp = [];
      for (const cl of SYNONYM_CLUSTERS) {
        if (cl.some(c => c.toLowerCase() === tl)) {
          for (const c of cl) {
            const clLow = c.toLowerCase();
            if (!variants.includes(clLow)) {
              variants.push(clLow);
              disp.push(c);
            }
          }
        }
      }
      return { variants, disp };
    }

    function offlineSearch(q) {
      const t0 = performance.now();
      ensureDecodedSnapshot();
      const snap = window.COCKPIT_SNAPSHOT || { items: [] };
      const rawBranches = q.toLowerCase().split("|").map(b => b.replace(STOPWORDS_RE, " ").trim().split(/\s+/).filter(Boolean)).filter(b => b.length > 0);
      const highlights = new Set();
      const synNotes = [];
      const seenSyn = new Set();

      const expandedBranches = rawBranches.map(tokens => {
        return tokens.map(tok => {
          const { variants, disp } = expandTermSynonymsJS(tok);
          variants.forEach(v => highlights.add(v));
          if (disp.length > 0) {
            const note = `${tok} → ${disp.slice(0, 4).join("/")}`;
            if (!seenSyn.has(note)) {
              seenSyn.add(note);
              synNotes.push(note);
            }
          }
          return variants;
        });
      });

      const counts = { all: 0, doc: 0, media: 0, folder: 0, memory: 0, session: 0, atlas: 0, skill: 0, todo: 0 };
      const scored = [];

      for (const it of snap.items) {
        if (!matchSubtypeExt(it.subtype, currentExt)) continue;
        if (currentCat !== "all" && it.category !== currentCat) continue;

        let score = 0;
        if (expandedBranches.length > 0) {
          const titleLow = String(it.title || "").toLowerCase();
          const sumLow = String(it.summary || "").toLowerCase();
          const pyLow = String(it.py || "").toLowerCase();
          const catLow = String(it.category || "").toLowerCase();
          const hay = `${titleLow} ${sumLow} ${pyLow} ${catLow}`;

          let branchHit = false;
          for (const br of expandedBranches) {
            if (br.every(varGroup => varGroup.some(v => hay.includes(v)))) {
              branchHit = true;
              for (const varGroup of br) {
                for (const v of varGroup) {
                  if (titleLow.includes(v)) score += 18;
                  else if (sumLow.includes(v)) score += 6;
                  else if (pyLow.includes(v)) score += 4;
                }
              }
            }
          }
          if (!branchHit) continue;
        }

        counts.all += 1;
        counts[it.kind] = (counts[it.kind] || 0) + 1;
        if (it.has_todo) counts.todo += 1;

        if (currentKind !== "all") {
          if (currentKind === "todo" && !it.has_todo) continue;
          if (currentKind !== "todo" && it.kind !== currentKind) continue;
        }
        scored.push({ it, score, ts: Number(it.sort_ts || 0) });
      }

      if (expandedBranches.length > 0) {
        scored.sort((a, b) => (b.score - a.score) || (b.ts - a.ts));
      }

      return {
        elapsed_ms: Number((performance.now() - t0).toFixed(2)),
        highlights: Array.from(highlights).sort((a, b) => b.length - a.length).slice(0, 16),
        synonym_notes: synNotes,
        counts,
        items: scored.slice(0, 120).map(x => x.it),
      };
    }

    async function runSearch() {
      const q = document.getElementById("searchInput").value.trim();
      let data;
      if (!IS_CLOUD_HOST) {
        try {
          const url = `${API_BASE}/api/search?q=${encodeURIComponent(q)}&kind=${encodeURIComponent(currentKind)}&ext=${encodeURIComponent(currentExt)}&cat=${encodeURIComponent(currentCat)}&limit=120`;
          const res = await fetch(url);
          data = await res.json();
          if (checkSchemaReload(data)) return;
          serverOnline = true;
          connectRealtimeSSE();
        } catch (_) {
          serverOnline = false;
          data = offlineSearch(q);
        }
      } else {
        serverOnline = false;
        data = offlineSearch(q);
      }

      updateTabCounts(data.counts);
      currentResults = data.items || [];

      const synEl = document.getElementById("synonymBanner");
      if (data.synonym_notes && data.synonym_notes.length) {
        synEl.textContent = "🧠 智能同义词扩展：" + data.synonym_notes.join(" ； ");
      } else {
        synEl.textContent = data.used_or_fallback ? "💡 已自动切换为宽泛关联匹配" : "";
      }

      const totalHit = (data.counts && data.counts.all) !== undefined ? data.counts.all : currentResults.length;
      document.getElementById("searchSummaryText").textContent =
        `⚡ 检索耗时 ${data.elapsed_ms} ms · 全库共命中 ${fmtNum(totalHit)} 条目标（当前展示前 ${currentResults.length} 条精选）`;

      const mainEl = document.getElementById("mainContent");
      if (!currentResults.length) {
        mainEl.innerHTML = `
          <div class="empty-box">
            <h3 style="margin:0 0 10px;">当前筛选下未找到与「${escapeHtml(q)}」匹配的条目</h3>
            <div style="margin-bottom:16px;">${currentExt !== "all" || currentCat !== "all" || currentKind !== "all" ? "检测到当前开启了分类或格式过滤，点击下方按钮可查看全库所有类型结果：" : "建议缩短关键词（如只输 2 个核心字）"}</div>
            ${(currentExt !== "all" || currentCat !== "all" || currentKind !== "all") ? `<button class="ctrl-btn active" onclick="resetAllFilters()">🔄 清除筛选并搜全库 (${fmtNum(totalHit)} 条)</button>` : ""}
          </div>
        `;
        return;
      }

      // 在“全部目标”页签且有查询词时，按七大资产层清晰分组展示，并标注该类总命中数
      if (currentKind === "all" && q) {
        const groups = [
          { key: "doc", title: "📄 匹配的文档与表格（PDF / Word / Excel / Markdown / 网页）", max: 10 },
          { key: "media", title: "🎬 匹配的视频成片 · 设计图 · 音频资产", max: 8 },
          { key: "folder", title: "📁 匹配的项目文件夹（一键直开目录）", max: 8 },
          { key: "memory", title: "📌 匹配的权威记忆结论与复盘", max: 8 },
          { key: "session", title: "💬 匹配的三端原对话（Antigravity / Codex / Claude）", max: 8 },
          { key: "atlas", title: "🏛️ 匹配的历史文化图库与影视镜头参考", max: 8 },
          { key: "skill", title: "🧰 匹配的全局 AI 技能", max: 6 },
        ];

        let groupedHtml = "";
        for (const g of groups) {
          const arr = currentResults.filter(x => x.kind === g.key);
          const totalInKind = (data.counts && data.counts[g.key]) || arr.length;
          if (arr.length > 0) {
            groupedHtml += `
              <div class="section-header">
                <h2>${g.title}（共命中 ${fmtNum(totalInKind)} 条）</h2>
                ${totalInKind > arr.length ? `<button class="ctrl-btn" onclick="setKind('${g.key}')">查看该类全部 ${fmtNum(totalInKind)} 条 →</button>` : ""}
              </div>
              <div class="cards-grid">${arr.slice(0, g.max).map(x => renderCard(x, data.highlights)).join("")}</div>
            `;
          } else if (totalInKind > 0) {
            groupedHtml += `
              <div class="section-header">
                <h2>${g.title}（共命中 ${fmtNum(totalInKind)} 条）</h2>
                <button class="ctrl-btn active" onclick="setKind('${g.key}')">点击展开这 ${fmtNum(totalInKind)} 条结果 →</button>
              </div>
            `;
          }
        }
        mainEl.innerHTML = groupedHtml;
      } else {
        mainEl.innerHTML = `<div class="cards-grid">${currentResults.map(x => renderCard(x, data.highlights)).join("")}</div>`;
      }
    }

    async function rebuildIndex() {
      const btn = document.getElementById("rebuildBtn");
      btn.textContent = "⏳ 正在增量同步…";
      btn.disabled = true;
      try {
        if (!IS_CLOUD_HOST) {
          const res = await fetch(`${API_BASE}/api/rebuild`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ full: false }),
          });
          const data = await res.json();
          if (data.ok && data.stats) {
            updateScaleBanner(data.stats);
            showToast(`✅ 本地与云端同步已触发：共纳管 ${fmtNum(data.stats.total_items)} 条主目标`);
            refreshView(true);
            return;
          }
        }
        // 云端或离线模式：动态重拉最新 version.js 与 snapshot.js
        await new Promise((resolve) => {
          const s = document.createElement("script");
          s.src = `data/version.js?t=${Date.now()}`;
          s.onload = () => {
            s.remove();
            const snapS = document.createElement("script");
            snapS.src = `data/snapshot.js?t=${Date.now()}`;
            snapS.onload = () => {
              snapS.remove();
              ensureDecodedSnapshot();
              if (window.COCKPIT_VERSION) updateScaleBanner(window.COCKPIT_VERSION);
              refreshView(true);
              showToast("✅ 已同步最新云端索引数据");
              resolve();
            };
            snapS.onerror = () => { snapS.remove(); resolve(); };
            document.body.appendChild(snapS);
          };
          s.onerror = () => { s.remove(); resolve(); };
          document.body.appendChild(s);
        });
      } catch (_) {
        showToast("⚠️ 正在使用当前最新快照数据");
      } finally {
        btn.textContent = "🔄 立即同步";
        btn.disabled = false;
      }
    }

    /* ============ 永久实时热同步引擎（SSE 毫秒推送 + 轮询双保险 + 离线/云端热重载） ============ */
    function handleIncomingStats(stats) {
      if (checkSchemaReload(stats)) return;
      if (!stats || !stats.version) return;
      if (knownVersion && stats.version !== knownVersion) {
        knownVersion = stats.version;
        updateScaleBanner(stats);
        const modalOpen = document.getElementById("detailModal").classList.contains("open");
        if (!modalOpen) {
          refreshView(true);
        }
      } else if (!knownVersion) {
        knownVersion = stats.version;
        updateScaleBanner(stats);
      }
    }

    function connectRealtimeSSE() {
      if (evtSource || IS_CLOUD_HOST) return;
      try {
        evtSource = new EventSource(`${API_BASE}/api/events`);
        evtSource.onmessage = ev => {
          try {
            const st = JSON.parse(ev.data);
            serverOnline = true;
            handleIncomingStats(st);
          } catch (_) {}
        };
        evtSource.onerror = () => {
          try { evtSource.close(); } catch (_) {}
          evtSource = null;
        };
      } catch (_) {
        evtSource = null;
      }
    }

    // 健康心跳与云端/离线 version.js 自动热重载探针
    setInterval(async () => {
      if (!IS_CLOUD_HOST) {
        try {
          const res = await fetch(`${API_BASE}/api/ping`);
          const d = await res.json();
          if (checkSchemaReload(d)) return;
          if (d.ok) {
            const wasOffline = !serverOnline;
            serverOnline = true;
            connectRealtimeSSE();
            if (wasOffline) {
              refreshView(true);
            } else if (d.stats) {
              handleIncomingStats(d.stats);
            }
            return;
          }
        } catch (_) {
          serverOnline = false;
        }
      }

      // 云端或 file:/// 离线状态下动态重载 data/version.js 检测最新推送
      const s = document.createElement("script");
      s.src = `data/version.js?t=${Date.now()}`;
      s.onload = () => {
        s.remove();
        if (window.COCKPIT_VERSION && window.COCKPIT_VERSION.version !== knownVersion) {
          const snapS = document.createElement("script");
          snapS.src = `data/snapshot.js?t=${Date.now()}`;
          snapS.onload = () => {
            snapS.remove();
            ensureDecodedSnapshot();
            handleIncomingStats(window.COCKPIT_VERSION);
          };
          document.body.appendChild(snapS);
        }
      };
      s.onerror = () => s.remove();
      document.body.appendChild(s);
    }, IS_CLOUD_HOST ? 45000 : 8000);

    // 全局统一事件委托：所有卡片按钮与标题点击直接从 itemStore 读取原始路径，0 字符串转义隐患
    document.addEventListener("click", ev => {
      const target = ev.target.closest("[data-act]");
      if (!target) return;
      const act = target.dataset.act;
      if (act === "topic-hub") {
        const tq = target.dataset.topicQ || "";
        if (tq) setQuickQuery(tq);
        return;
      }
      const itemId = target.dataset.id;
      const it = itemStore.get(itemId);
      if (!it) return;

      if (act === "open") {
        openTarget(it.path, "open", "", it.id);
      } else if (act === "reveal") {
        openTarget(it.path, "reveal", "", it.id);
      } else if (act === "obsidian") {
        openTarget(it.path, "obsidian", it.obsidian_rel || "", it.id);
      } else if (act === "copy-path") {
        copyText(it.path || "", "📋 已复制完整路径");
      } else if (act === "copy-prompt") {
        copyStoredPrompt(it.id);
      } else if (act === "copy-skill") {
        copyText("/" + it.title, "⚡ 已复制技能调用名");
      } else if (act === "preview-media") {
        openPreviewModal(it.id);
      } else if (act === "detail") {
        viewDetail(it.id, it.title, it.summary, it.path, it.obsidian_rel);
      } else if (act === "open-linked") {
        const fidx = Number(target.dataset.fidx || "0");
        const lf = (it.extra && it.extra.linked_files && it.extra.linked_files[fidx]) || "";
        if (lf) openTarget(lf, "open", "", "");
      } else if (act === "title-click") {
        const subLow = String(it.subtype || "").toLowerCase();
        if (it.kind === "media" && ["mp4", "mov", "wav", "mp3", "png", "jpg", "jpeg", "webp"].includes(subLow)) {
          openPreviewModal(it.id);
        } else if (["doc", "media", "folder"].includes(it.kind)) {
          openTarget(it.path, "open", "", it.id);
        } else {
          viewDetail(it.id, it.title, it.summary, it.path, it.obsidian_rel);
        }
      }
    });

    // 键盘快捷交互
    document.getElementById("searchInput").addEventListener("input", e => {
      const v = e.target.value;
      document.getElementById("clearBtn").classList.toggle("visible", !!v);
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        refreshView();
      }, 90);
    });

    document.getElementById("searchInput").addEventListener("keydown", e => {
      if (e.key === "Enter" && currentResults.length > 0) {
        const first = currentResults.find(x => ["doc", "media", "folder"].includes(x.kind)) || currentResults[0];
        if (["doc", "media", "folder"].includes(first.kind)) {
          openTarget(first.path, "open", "", first.id);
        } else {
          viewDetail(first.id, first.title, first.summary, first.path, first.obsidian_rel);
        }
      }
    });

    window.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        const modal = document.getElementById("detailModal");
        if (modal.classList.contains("open")) {
          closeModal();
        } else if (document.getElementById("searchInput").value || currentExt !== "all" || currentCat !== "all") {
          resetAllFilters();
          clearSearch();
        }
      } else if (e.key === "/" && document.activeElement !== document.getElementById("searchInput")) {
        e.preventDefault();
        document.getElementById("searchInput").focus();
      }
    });

    initPrefs();
    syncFilterPillsUI();
    (async () => {
      const qs = new URLSearchParams(window.location.search);
      const initQ = (qs.get("q") || "").trim();
      const initKind = (qs.get("kind") || "").trim();
      if (initKind && ALL_TAB_KEYS.includes(initKind)) {
        currentKind = initKind;
        syncFilterPillsUI();
      }
      if (initQ) {
        const inp = document.getElementById("searchInput");
        inp.value = initQ;
        document.getElementById("clearBtn").classList.add("visible");
        try {
          const pingRes = await fetch(`${API_BASE}/api/ping`);
          const pingData = await pingRes.json();
          if (pingData && pingData.stats) updateScaleBanner(pingData.stats);
        } catch (_) {}
        runSearch();
      } else {
        loadHome();
      }
    })();
  </script>
